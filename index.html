<title>展示会ナビ</title>
<meta name="description" content="展示会の予定づくりと会場ナビ。行きたい会社を入れると、近い順に回る時間割を組み、会場の地図で次の小間まで案内します。（デモは架空の会場・出展社のデータ）">

<style>
/* 1カラムの時刻表：左に時刻レール、右にホールごとのカード。ホール色は会場マップ（東=ピンク・西=青・南=緑）に合わせる */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1b2430; --muted:#5d6a78; --line:#d9dfe6;
  --accent:#d9480f; --star-bg:#fff1e8;
  --east:#c2185b; --west:#1f4fa0; --south:#2e7d4f; --move:#6b7684;
  --done:#9aa5b1;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1b2128; --fg:#e7ecf1; --muted:#9aa7b4; --line:#2c343e;
  --accent:#ff7a3d; --star-bg:#2e2016;
  --east:#f06a9b; --west:#6f9cf0; --south:#5fc28a; --move:#8b96a3; --done:#5d6875; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2128; --fg:#e7ecf1; --muted:#9aa7b4; --line:#2c343e;
  --accent:#ff7a3d; --star-bg:#2e2016;
  --east:#f06a9b; --west:#6f9cf0; --south:#5fc28a; --move:#8b96a3; --done:#5d6875; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;font-weight:900;margin:0;text-wrap:balance;letter-spacing:.02em}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.prog{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent);background:var(--star-bg);border-radius:999px;padding:4px 10px;white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.note b{color:var(--accent)}
.tl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.time{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);padding-top:12px;text-align:right;line-height:1.3}
.time span{display:block;font-weight:500;font-size:11px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--hall);border-radius:10px;padding:10px 12px 8px}
.card.plain{border-left-color:var(--move);background:transparent}
.hall{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hall strong{font-size:16px;font-weight:700;color:var(--hall)}
.card.plain .hall strong{color:var(--fg)}
.hall em{font-style:normal;font-size:12px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin:4px 0 0}
.items{list-style:none;margin:6px 0 0;padding:0;display:grid}
.items li{border-top:1px dashed var(--line)}
.items li:first-child{border-top:0}
.items label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;cursor:pointer}
.items input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.items .nm{min-width:0}
.items .tag{font-size:11px;color:var(--muted);margin-left:4px}
.items li.star .nm{font-weight:700}
.items li.star .nm::before{content:"★ ";color:var(--accent)}
.items li.star{background:var(--star-bg);margin-inline:-12px;padding-inline:12px}
.items li.done .nm{color:var(--done);text-decoration:line-through}
.booth{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--hall);border:1px solid var(--hall);border-radius:6px;padding:2px 7px;text-decoration:none;white-space:nowrap}
.booth:focus-visible,.items input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.text-only{padding:6px 0;font-size:14px}
h2{font-size:15px;font-weight:700;margin:28px 0 8px;letter-spacing:.04em}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.box p{margin:0 0 6px}.box p:last-child{margin:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.st{white-space:nowrap;font-weight:700}
.ok{color:var(--south)}.ng{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.reset{margin-top:14px;font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.items li{transition:background .2s}}
.hbtns{display:flex;gap:8px;align-items:center;flex-shrink:0}
.ebtn-main{white-space:nowrap;flex-shrink:0;font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
body.editing .ebtn-main{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.time input{display:block;width:100%;font:inherit;font-family:var(--f-mono);font-size:12px;padding:2px 0;margin-bottom:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
body.editing .slot{grid-template-columns:78px minmax(0,1fr)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-top:7px}
.ebtn{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 8px}
.ebtn button,.stools button,.add button{font:inherit;font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;min-height:32px}
.ebtn button:disabled,.stools button:disabled{opacity:.35;cursor:default}
.ebtn .del{color:var(--accent);margin-left:auto}
.stools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.add input:not([type=checkbox]){font:inherit;font-size:15px;width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.astar{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);font-weight:700}
.add button[type=submit]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.ahint{margin:0;font-size:12px;color:var(--accent)}
.ahint:empty{display:none}
.reset.arm{color:var(--accent);border-color:var(--accent)}
button:focus-visible,.add input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.hl h1{min-width:0}
.back{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.primary{display:block;width:100%;margin-top:14px;font:inherit;font-size:16px;font-weight:700;color:var(--surface);background:var(--accent);border:0;border-radius:10px;padding:12px;cursor:pointer}
.empty{margin-top:18px;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px}
.empty p{margin:0 0 6px}
.empty button,.pact button,.sact button{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.sopen{all:unset;cursor:pointer;display:grid;gap:2px}
.sopen strong{font-size:16px}
.sopen span{font-size:13px;color:var(--muted);font-family:var(--f-body)}
.sopen:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.sact{display:flex;gap:8px;flex-wrap:wrap}
.sact .del{color:var(--accent);margin-left:auto}
.sact .del.arm{border-color:var(--accent)}
.setup{display:grid;gap:12px;margin-top:14px}
.f{display:grid;gap:4px;min-width:0}
.f span{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select{font:inherit;font-size:16px;width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.setup h2{margin:10px 0 0}
.setup .add{margin-top:0;border-top:0;padding-top:0}
.picks{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.picks li.star{margin-inline:-12px}
.warn{margin:0;font-size:13px;color:var(--accent)}
.warnbox{border-color:var(--accent);color:var(--accent)}
.pact{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.foot{margin-top:14px}
.bk{display:grid;gap:8px}
.bk .row{display:flex;gap:8px;flex-wrap:wrap}
.bk button{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:36px}
.bk button.go{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.bk textarea{font:12px/1.4 var(--f-mono);width:100%;min-width:0;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);word-break:break-all}
.bk .msg{margin:0;font-size:13px;font-weight:700;color:var(--south)}
.bk .msg.ng{color:var(--accent)}
.bk .msg:empty{display:none}
.stale{border-color:var(--accent)}
.bkbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;background:var(--star-bg);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--accent)}
.bkbar span{flex:1 1 160px}
.bkbar button{font:inherit;font-size:13px;font-weight:700;color:var(--surface);background:var(--accent);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.intro p{margin:0 0 6px}.intro p:last-child{margin:0}
.isteps{margin:0;padding:12px 14px 12px 32px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;gap:8px;font-size:15px}
.isteps li::marker{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.resume .primary{margin-top:10px}
.start{margin-top:14px;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:10px}
.start .sh{margin:0;font-size:16px;color:var(--accent)}
.start .sub{margin:0}
.stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stgrid button{display:grid;gap:2px;justify-items:start;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.stgrid button b{font-size:16px}.stgrid button small{font-size:12px;color:var(--muted)}
.stgrid button.go{background:var(--accent);border-color:var(--accent);color:var(--surface)}.stgrid button.go small{color:var(--surface);opacity:.9}
.stgrid.hp button{border-left:5px solid var(--hc)}
.linkish{justify-self:start;font:inherit;font-size:14px;font-weight:700;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer}
.startbar{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.startbar button{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}

// 候補の一覧（社名（小間）と企画）
const OPTS={};
EX.forEach(([n,b])=>{OPTS[`${n}（${b}）`]={nm:n,b}});
SPECIALS.forEach(([n,a,p])=>{OPTS[`${n}（${p}）`]={nm:n,b:"",area:a}});
function lookup(nm,b){
  if(b){b=b.toUpperCase();if(!PREF[b.slice(0,2)])return {err:"小間番号の形が違います（例：A1005・B2017・C4033）。"};return {it:{nm,b}}}
  const sp=SPECIALS.find(([n])=>n===nm);if(sp)return {it:{nm,b:"",area:sp[1]}};
  let hits=EX.filter(([n])=>n===nm);if(!hits.length)hits=EX.filter(([n])=>n.includes(nm));
  if(hits.length===1)return {it:{nm:hits[0][0],b:hits[0][1]}};
  if(hits.length>1)return {err:`「${nm}」は${hits.length}件あります。候補から選ぶか、小間番号も入れてください。`};
  return {err:`「${nm}」は出展社一覧に見つかりません。小間番号も入れてください。`};
}

// 時刻の割り振り：待ち・昼・移動は決まった長さ、ホールの枠は会社の数に応じて残りの時間を分ける（最低15分）
function retime(s){
  const close=DATES[s.date].close,end=Math.min(toM(s.end),close);
  let t=toM(s.start);
  const ws=s.plan.find(x=>x.kind==="wait");
  if(ws&&t>=OPEN)s.plan=s.plan.filter(x=>x!==ws);
  if(!s.plan.some(x=>x.kind==="wait")&&t<OPEN)s.plan.splice(s.plan[0]&&s.plan[0].kind==="seen"?1:0,0,{id:nid("s"),kind:"wait",name:"正面入場口で待つ",hall:"move",sub:"10:00に開場。来場者証を手元に。開いたら「スタート」を押す。",items:[]});
  const begin=Math.max(t,OPEN);
  let fixed=0;s.plan.forEach(x=>{if(x.kind==="lunch")fixed+=s.lunchMin;if(x.kind==="move")fixed+=x.dur});
  const areas=s.plan.filter(x=>x.kind==="area");
  const W=areas.reduce((a,x)=>a+Math.max(1,x.items.length),0)||1;
  const avail=end-begin-fixed;
  let used=0;areas.forEach(x=>{x.dur=Math.max(15,Math.floor(avail*Math.max(1,x.items.length)/W/5)*5);used+=x.dur});
  if(areas.length&&used<avail)areas[areas.length-1].dur+=avail-used;
  s.short=used>avail;
  s.plan.forEach(x=>{
    if(x.kind==="seen"||x.kind==="extra"){x.t="";x.e="";return}
    if(x.kind==="wait"){x.t=fmt(t);x.e=fmt(OPEN);t=OPEN;return}
    if(x.kind==="leave"){x.t=fmt(Math.max(t,end));x.e="";return}
    const d=x.kind==="lunch"?s.lunchMin:x.dur;
    x.t=fmt(t);x.e=fmt(t+d);t+=d;
  });
  const lv=s.plan.find(x=>x.kind==="leave");if(lv)lv.sub=`閉場は${fmt(close).replace(/^0/,"")}。`;
}
// 回る順番：正面入場口か、実際に入ったホールから、移動の近い順にたどる（★は各ホールの中で先に）
const BLDA={};ROUTE.forEach(a=>{(BLDA[AREAS[a].hall]=BLDA[AREAS[a].hall]||[]).push(a)});
const travel=(a,b)=>a===b?0:a==="ent"?ENTMIN[b]:b==="ent"?ENTMIN[a]:transitPlan(a,b).min;
function moveSub(a,b){const A=AREAS[b],j=ROUTE.indexOf(b);
  if(a==="ent")return j===2||j===3?`正面入場口を入ってすぐ、${j===2?"左":"右"}手が${A.name}の入口。`:`正面入場口から中央通路を${j<2?"左（A棟側）":"右（C棟側）"}へ進み、${A.name}へ。`;
  return routeText(a,b)}
function orderAreas(has,from,startArea){
  const rem=new Set(has),out=[];let loc="ent";
  const pick=()=>{let best=null;rem.forEach(a=>{if(best===null||travel(loc,a)<travel(loc,best)||(travel(loc,a)===travel(loc,best)&&ROUTE.indexOf(a)<ROUTE.indexOf(best)))best=a});return best};
  if(startArea){loc=startArea;if(rem.has(startArea)){out.push(startArea);rem.delete(startArea)}}
  else if(BLDA[from]){const c=BLDA[from].filter(a=>rem.has(a)).sort((x,y)=>ENTMIN[x]-ENTMIN[y])[0];if(c){out.push(c);rem.delete(c);loc=c}}
  else{}
  while(rem.size){if(!out.length&&loc==="ent"){const a=pick();out.push(a);rem.delete(a);loc=a;continue}const a=pick();out.push(a);rem.delete(a);loc=a}
  return out}
function buildCore(s,picks,opt){
  const g={};picks.forEach(p=>{const a=areaOf(p);(g[a]=g[a]||[]).push(p)});
  const inc=orderAreas(Object.keys(g).filter(a=>ROUTE.includes(a)),s.from,opt.startArea);
  const plan=[];
  if(opt.seen&&opt.seen.length)plan.push({id:nid("s"),kind:"seen",name:"見た会社",hall:"move",sub:"",items:opt.seen});
  let prev=opt.startArea||"ent";
  inc.forEach(a=>{
    const m=travel(prev,a);
    if(prev!==a&&m>=5)plan.push({id:nid("s"),kind:"move",name:prev==="ent"?`入場口から${AREAS[a].name}へ（目安${m}分）`:`移動（目安${m}分）`,hall:"move",dur:m,sub:moveSub(prev,a),items:[]});
    const items=g[a].slice().sort((x,y)=>(y.st-x.st)||(x.b||"~").localeCompare(y.b||"~"));
    plan.push({id:nid("s"),kind:"area",area:a,...AREAS[a],items,sub:items.some(i=>i.st)?"先に★の会社を見てから、ほかを回る。":""});
    prev=a;
  });
  plan.push({id:nid("s"),kind:"leave",name:"会場を出る",hall:"move",items:[]});
  s.plan=plan;retime(s);
  const endM=Math.min(toM(s.end),DATES[s.date].close);
  if(s.lunchMin>0&&toM(s.lunch)<endM&&toM(s.lunch)+s.lunchMin>toM(s.start)&&!opt.noLunch){
    let idx=s.plan.findIndex(x=>x.kind==="area"&&toM(x.t)>=toM(s.lunch)-15);
    if(idx<0)idx=s.plan.findIndex(x=>x.kind==="leave");
    if(idx>0&&s.plan[idx-1].kind==="move")idx--;
    s.plan.splice(Math.max(idx,0),0,{id:nid("s"),kind:"lunch",name:"昼食",hall:"move",sub:LUNCH_SUB,items:[]});

// 時間が足りないときは★だけで時間割を組み、★以外は最後の「時間があれば」枠へ（近い順）
function build(s,picks,opt){opt=opt||{};
  buildCore(s,picks,opt);
  const stars=picks.filter(p=>p.st),rest=picks.filter(p=>!p.st);
  if(!s.short||!stars.length||!rest.length)return;
  buildCore(s,stars,opt);
  const last=[...s.plan].reverse().find(x=>x.kind==="area"),ord=orderAreas([...new Set(rest.map(areaOf))].filter(a=>ROUTE.includes(a)),s.from,last?last.area:opt.startArea);
  const ex=rest.filter(p=>!ROUTE.includes(areaOf(p))).concat(...ord.map(a=>rest.filter(p=>areaOf(p)===a)));
  const li=s.plan.findIndex(x=>x.kind==="leave");
  s.plan.splice(li,0,{id:nid("s"),kind:"extra",name:"時間があれば（★のあと、近い順）",hall:"move",sub:"★を見終わって時間が残ったら、上から順に。",items:ex});
  retime(s)}

// バックアップ：予定をテキストにして、LINEのKeepメモなどに残せるようにする
const b64e=u=>{let t="";for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};

async function encodeBk(){

  let body;try{if(typeof CompressionStream==="function")body="NV1z:"+b64e(await pipe(raw,CompressionStream))}catch(e){}
  if(!body)body="NV1j:"+b64e(raw);
  return `【展示会ナビの予定のバックアップ】\n予定づくりアプリの「バックアップを読み込む」に、この文をまるごと貼り付けると予定が戻ります。\n${body}\n（ここまで）`;
}
async function decodeBk(text){
  const m=String(text).replace(/\s+/g,"").match(/NV1([zj]):([A-Za-z0-9+/]+=*)/);
  if(!m)throw new Error("バックアップの文が見つかりません。「NV1」で始まる部分まで全部貼り付けてください。");
  let bytes=b64d(m[2]);
  if(m[1]==="z"){if(typeof DecompressionStream!=="function")throw new Error("このブラウザでは読み込めません。Safari か Chrome で開いてください。");bytes=await pipe(bytes,DecompressionStream)}
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||!Array.isArray(o.list))throw new Error("中身が予定の形になっていません。");
  if(o.gates&&typeof o.gates==="object")db.gates=Object.assign(db.gates||{},o.gates);
  if(o.draft&&Array.isArray(o.draft.picks)&&o.draft.picks.length&&!(db.draft&&db.draft.picks&&db.draft.picks.length))db.draft=o.draft;
  return o.list.filter(x=>x&&x.id&&Array.isArray(x.plan)&&DATES[x.date]);
}

// 会場地図：架空の会場の小間割図（maps/*.svg）。座標は図と同じ単位（1px=32）
const FA=Object.fromEntries(Object.entries(AF).map(([a,f])=>[f,a]));
const fileOfB=b=>AF[PREF[(b||"").slice(0,2).toUpperCase()]]||"";
function boothPos(b){if(!b)return null;b=b.toUpperCase();const h=fileOfB(b);if(!h)return null;const d=BOOTH[h];
  let v=d[b];if(!v){const base=b.replace(/-\d+$/,"");v=d[base]||d[Object.keys(d).find(k=>k.startsWith(base+"-"))]}
  return v?{h,b,lat:v[0],lng:v[1]}:null}
const namesOf=b=>{const n=EX.filter(x=>x[1]===b).map(x=>x[0]);return n.length?n.slice(0,2).join("・")+(n.length>2?` ほか${n.length-2}社`:""):""};
function inPoly(y,x,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [yi,xi]=P[i],[yj,xj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function boothAt(h,lat,lng){const d=BOOTH[h];for(const k in d)if(inPoly(lat,lng,d[k][2]))return k;return ""}
function routeText(fa,ta){const i=ROUTE.indexOf(fa),j=ROUTE.indexOf(ta);if(i<0||j<0||i===j)return "";
  const lo=Math.min(i,j),hi=Math.max(i,j);let segs=SEG.slice(lo,hi);if(i>j)segs=segs.slice().reverse();
  return `目安${segs.reduce((a,x)=>a+x.m,0)}分。`+segs.map(x=>x.sub).join("。")+"。"}
// 次の行き先：今いる小間が予定にあれば、その次のまだ見ていない小間。予定外（寄り道）なら、予定の中でまだ見ていない最初の小間
function nextOf(s,pos){
  const seq=allItems(s),open=it=>!s.done[it.id];
  if(pos&&pos.nextId&&!pos.b){const k=seq.find(it=>it.id===pos.nextId);if(k&&open(k))return k}
  const i=pos&&pos.b?seq.findIndex(it=>(it.b||"").toUpperCase()===pos.b):-1;
  if(i>=0)return seq.slice(i+1).find(open)||seq.slice(0,i).find(open)||null;
  return seq.find(open)||null}

    <div class="pact"><button type="button" data-act="toplan">時刻表に戻る</button></div>`;

// ホール間の出入口（目安の位置。どの出口がどこへ通じるかは、現地で直せる）
let fixGate="",faceMode=false,lastFrom=null,lastTo=null;

function turnOf(dir,from,to){const fx=dir[1],fy=dir[0],tx=to[1]-from[1],ty=to[0]-from[0];

// 移動マップ：会場の案内図をもとにした簡易図。ルートと時間は目安
function transitPlan(fa,ta){const i=ROUTE.indexOf(fa),j=ROUTE.indexOf(ta),lo=Math.min(i,j),hi=Math.max(i,j);
  let segs=SEG.slice(lo,hi);if(i>j)segs=segs.slice().reverse();
  const nm=a=>AREAS[a].name;
  return {st:[`${nm(fa)}を出る`,...segs.map(x=>x.sub),`${nm(ta)}の入口へ`],min:segs.reduce((a,x)=>a+x.m,0)}}
// 会場全体図（maps/site.svg）の上に道順を重ねる。座標は図のピクセル。経路は中央通路（y=CY）に沿って進む
const SITE=VENUE.site,ENTPT=SITE.entpt,HP=SITE.hp,CY=SITE.conc;
function routeSegs(fa,ta){
  if(ta==="ent")return routeSegs("ent",fa).map(x=>({p:x.p.slice().reverse(),d:x.d})).reverse();
  const a=fa==="ent"?ENTPT:HP[fa],b=HP[ta],p=[a,[a[0],CY],[b[0],CY],b].filter((q,i,A)=>!i||q[0]!==A[i-1][0]||q[1]!==A[i-1][1]);
  return [{p}]}

  let x0=Math.min(...pts.map(q=>q[0]))-50,x1=Math.max(...pts.map(q=>q[0]))+50,y0=Math.min(...pts.map(q=>q[1]))-50,y1=Math.max(...pts.map(q=>q[1]))+50;
  const mw=340,mh=300;if(x1-x0<mw){const c=(x0+x1)/2;x0=c-mw/2;x1=c+mw/2}if(y1-y0<mh){const c=(y0+y1)/2;y0=c-mh/2;y1=c+mh/2}
  if(siteFull){x0=0;y0=0;x1=SITE.w;y1=SITE.h}
  x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(SITE.w,x1);y1=Math.min(SITE.h,y1);
  const w=x1-x0,h=y1-y0,r=Math.max(6,w/40),pl=a=>a.map(q=>q.join(",")).join(" ");

  return `<div class="sitewrap"><svg viewBox="${x0} ${y0} ${w} ${h}" class="sitemap" role="img" aria-label="会場マップの道順">
    <image href="maps/site.svg" x="0" y="0" width="${SITE.w}" height="${SITE.h}"/>

    <circle cx="${st[0]}" cy="${st[1]}" r="${r}" class="tw-from"/><circle cx="${en[0]}" cy="${en[1]}" r="${r}" class="tw-to"/>
  </svg></div>

// ホールの入口に着いた：入場口側の入口を現在地にして、そこから次の小間まで案内

    const items=x.items.map((it,i)=>itemHTML(it,x,i,si,s.plan)).join("");
    const time=editing?`<div class="time"><input type="time" value="${esc(x.t)}" data-act="t" data-s="${si}" aria-label="始まり"><input type="time" value="${esc(x.e||"")}" data-act="e" data-s="${si}" aria-label="終わり"></div>`
      :`<div class="time">${hm(x.t)}${x.e?`<span>〜${hm(x.e)}</span>`:""}</div>`;
    const tools=editing?`<div class="stools"><button type="button" data-act="sup" data-s="${si}" ${si===0?"disabled":""}>この枠を上へ</button>
        <button type="button" data-act="sdn" data-s="${si}" ${si===s.plan.length-1?"disabled":""}>この枠を下へ</button></div>
      <form class="add" data-s="${si}"><input id="an${x.id}" placeholder="会社名を入れる（読みでも探せます）" autocomplete="off" data-act="aname"><div class="sugg" hidden></div>
        <button type="button" class="pickbtn" data-pk="open">頭文字から選ぶ</button>
        <div class="arow">${boothBox("ab"+x.id,x.area&&AF[x.area]?pfxOfHall(AF[x.area]):curPfx(),"小間の数字")}<label class="astar"><input type="checkbox" id="as${x.id}">★</label><button type="submit">追加</button></div>
        <p class="ahint" id="ah${x.id}"></p></form>`:"";
    const mv=x.kind==="move"&&!editing?`<label class="mvchk"><input type="checkbox" data-act="check" data-it="${x.id}" ${s.done[x.id]?"checked":""}>移動した</label>`:"";
    return `<li class="slot">${time}<div class="card ${x.hall==="move"?"plain":""} ${x.kind==="move"&&s.done[x.id]?"mvdone":""}" style="--hall:var(--${x.hall})"><div class="hall"><strong>${esc(x.name)}</strong>${x.tag?`<em>${esc(x.tag)}</em>`:""}</div>
      ${x.sub?`<p class="sub">${esc(x.sub)}</p>`:""}${items?`<ul class="items">${items}</ul>`:""}${mv}${tools}</div></li>`}).join("");
  V.innerHTML=`${s.short?`<div class="note warnbox">時間が足りません。どのホールにも最低15分をとると、帰る時刻を過ぎます。会社を減らすか、帰る時刻を遅くしてください。</div>`:""}
   <div class="note">★＝特に行きたい会社。チェックで「見た」になります。右上の「編集」で、会社の追加・順番の入れ替え・時刻の変更ができます。</div>
   ${editing?"":startHTML(s)}
   <button type="button" class="tomap" data-act="tomap">地図で今いる場所と次の行き先を見る</button>
   <ol class="tl">${rows}</ol>
   <div class="pact"><button type="button" data-act="retime">今の順番のまま時間を割り振り直す</button>
     <button type="button" data-act="resetup">条件を変えて組み直す</button>
     <button type="button" data-act="tolist">予定の一覧へ</button>
     <button type="button" data-act="tobk">バックアップを書き出す</button></div>
   <p class="sub foot">ホール間の移動時間・各ホールの滞在時間は、会場図からの目安です。会場・出展社・小間番号は、すべて架空のデータです（実在のものとは関係ありません）。</p>`;
}

const swap=(a,i,j)=>{[a[i],a[j]]=[a[j],a[i]]};
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act!=="sdel")arm="";
  if(act==="new"){if(db.draft&&db.draft.picks&&db.draft.picks.length){draft=db.draft;toast("作りかけの予定を開きました。");return go("setup")}draft=newDraft();return go("setup")}
  if(act==="resume"){draft=db.draft;return go("setup")}
  if(act==="onb"){db.onb=Date.now();store();return render()}
  if(act==="onbskip"){db.onb=-1;store();return render()}
  if(act==="bkquick")return quickCopy(b);
  if(act==="start"||act==="starth"){startFrom(cur,act==="start"?b.dataset.v:cur.from,act==="starth"?b.dataset.a:"");startOpen=false;hallPick=false;
    if(act==="starth"){go("map");toast(`${AREAS[b.dataset.a].name}の入口から、次の小間まで案内します。`);return}
    cur.entNav=true;save();go("map");toast("入場口から最初のホールへの道順です。ホールの入口に着いたら、オレンジのボタンを押してください。");return}
  if(act==="hallpick"){hallPick=!hallPick;return render()}
  if(act==="stopen"){startOpen=true;return render()}
  if(act==="stclose"){startOpen=false;hallPick=false;return render()}
  if(act==="sample"){draft={...newDraft(),name:"見本の予定",picks:EVENT.sample.map(p=>({...p}))};return go("setup")}
  if(act==="open")return go("plan",id);
  if(act==="copy"){const s=db.list.find(x=>x.id===id),c=JSON.parse(JSON.stringify(s));c.id=nid("p");c.name=s.name+"（コピー）";c.done={};db.list.unshift(c);save();return render()}
  if(act==="sdel"){if(arm!=="del"+id){arm="del"+id;return render()}db.list=db.list.filter(x=>x.id!==id);arm="";save();return render()}
  if(act==="tolist")return go("list");
  if(act==="tomap")return go("map");
  if(act==="arrive"){const h=b.dataset.h;go("map");return arriveAt(h)}
  if(act==="entnav"){cur.entNav=true;save();return go("map")}
  if(act==="toplan")return go("plan");
  if(act==="tobk"){go("list");return exportBk()}
  if(act==="bkout")return exportBk();
  if(act==="bkin"){bk={mode:"in",text:"",msg:"",ng:false};render();const ta=document.getElementById("bk-in");if(ta)ta.focus();return}
  if(act==="bkcopy"){const ta=document.getElementById("bk-out"),m=document.getElementById("bk-msg");
    const sel=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length)};
    const ok=()=>{m.className="msg";m.textContent="コピーしました。LINEのKeepメモや自分あてのトークに貼っておいてください。"};
    const fb=()=>{sel();let d=false;try{d=document.execCommand("copy")}catch(e){}
      if(d)ok();else{m.className="msg ng";m.textContent="自動でコピーできませんでした。選択された文を長押しして「コピー」を選んでください。"}};
    try{navigator.clipboard.writeText(bk.text).then(ok,fb)}catch(e){fb()}return}
  if(act==="bkload"){const t=document.getElementById("bk-in").value;
    decodeBk(t).then(list=>{
      if(!list.length)throw new Error("読み込める予定が入っていませんでした。");
      let add=0,up=0;list.slice().reverse().forEach(s=>{const i=db.list.findIndex(x=>x.id===s.id);if(i>=0){db.list[i]=s;up++}else{db.list.unshift(s);add++}});
      save();db.bk=db.mod;store();bk={mode:"",text:"",msg:`${list.length}件の予定を読み込みました（新しく${add}件・上書き${up}件）。`,ng:false};render();
    }).catch(err=>{bk={mode:"in",text:"",msg:err&&err.message&&/[ぁ-ん]/.test(err.message)?err.message:"読み込めませんでした。文が途中で切れていないか確かめてください。",ng:true};
      render();const ta=document.getElementById("bk-in");if(ta)ta.value=t});return}
  if(act==="padd"){const nm=document.getElementById("p-name").value.trim(),bb=boothVal(document.getElementById("p-booth")),h=document.getElementById("p-hint");
    readSetup();if(!nm){h.textContent="会社名を入れてください。";return}
    const r=lookup(nm,bb);if(r.err){h.textContent=r.err;return}
    draft.picks.push({...r.it,id:nid("i"),st:document.getElementById("p-star").checked});renderSetup();document.getElementById("p-name").focus();return}
  if(act==="pstar"){readSetup();const p=draft.picks[+b.dataset.i];p.st=!p.st;return renderSetup()}
  if(act==="pdel"){readSetup();draft.picks.splice(+b.dataset.i,1);return renderSetup()}
  if(act==="retime"){retime(cur);save();return render()}
  if(act==="resetup"){const s=cur;draft={id:s.id,name:s.name,date:s.date,start:s.start,end:s.end,lunch:s.lunch,lunchMin:s.lunchMin,from:s.from,picks:allItems(s).map(i=>({...i,area:i.area||areaOf(i)||undefined}))};return go("setup")}
  if(view==="plan"){
    const si=+b.dataset.s,i=+b.dataset.i,P=cur.plan,s=P[si];
    if(act==="star")s.items[i].st=!s.items[i].st;
    else if(act==="idel")s.items.splice(i,1);
    else if(act==="iup"){if(i>0)swap(s.items,i,i-1);else P[si-1].items.push(s.items.shift())}
    else if(act==="idn"){if(i<s.items.length-1)swap(s.items,i,i+1);else P[si+1].items.unshift(s.items.pop())}
    else if(act==="sup"&&si>0)swap(P,si,si-1);
    else if(act==="sdn"&&si<P.length-1)swap(P,si,si+1);
    else return;
    save();render();
  }
});
document.addEventListener("input",e=>{
  const el=e.target;if(el.dataset.act!=="aname")return;
  const o=OPTS[el.value];if(!o)return;
  const box=el.closest(".add");el.value=o.nm;setBooth(box,o.b);box.dataset.area=o.area||"";
});
document.addEventListener("change",e=>{
  if(view==="setup"&&e.target.closest("#setup")&&e.target.id&&e.target.id.startsWith("f-")){readSetup();if(!draft.id){db.draft=draft;save();updBk()}return}
  const el=e.target,act=el.dataset.act;if(view!=="plan")return;
  if(act==="check"){cur.done[el.dataset.it]=el.checked;save();render()}
  else if(act==="t"||act==="e"){cur.plan[+el.dataset.s][act]=el.value;save()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="setup"){const pn=document.getElementById("p-name");
    if(pn&&pn.value.trim()){const n0=draft.picks.length,ab=document.querySelector("#padd [data-act=padd]");if(ab)ab.click();
      if(draft.picks.length===n0){const hh=document.getElementById("f-hint");if(hh)hh.textContent="入力中の会社を追加できませんでした。上の赤い説明を見て直すか、入力欄を空にしてください。";return}}
    readSetup();const d=draft,h=document.getElementById("f-hint");
    if(!d.picks.length){h.textContent="行きたい会社を1社以上入れてください。";return}
    if(!d.start||!d.end||toM(d.end)<=toM(d.start)){h.textContent="会場を出る時刻は、着く時刻より後にしてください。";return}
    if(toM(d.start)>=DATES[d.date].close){h.textContent="着く時刻が閉場の時刻より後になっています。";return}
    let s=d.id?db.list.find(x=>x.id===d.id):null;
    if(!s){s={id:nid("p"),done:{}};db.list.unshift(s)}
    Object.assign(s,{name:d.name||`${DATES[d.date].label}の予定`,date:d.date,start:d.start,end:d.end,lunch:d.lunch||"12:00",lunchMin:d.lunchMin,from:d.from});
    build(s,d.picks.map(p=>({id:p.id||nid("i"),nm:p.nm,b:p.b||"",area:p.area,st:!!p.st,tag:p.tag||""})));
    if(!d.id)delete db.draft;save();cur=s;return go("plan",s.id)}
  const s=cur.plan[+f.dataset.s],nm=document.getElementById("an"+s.id).value.trim(),bb=boothVal(document.getElementById("ab"+s.id)),h=document.getElementById("ah"+s.id);
  if(!nm){h.textContent="会社名を入れてください。";return}
  let it={nm,b:bb.toUpperCase()};
  if(!bb){const r=lookup(nm,"");if(r.it)it=r.it;else if(!f.dataset.area&&r.err&&r.err.includes("件あります")){h.textContent=r.err;return}}
  s.items.push({...it,id:nid("i"),st:document.getElementById("as"+s.id).checked,tag:"追加"});save();render();
});
document.getElementById("back").addEventListener("click",()=>go(view==="map"?"plan":"list"));
document.getElementById("edit").addEventListener("click",()=>{editing=!editing;render()});
render();
</script>
